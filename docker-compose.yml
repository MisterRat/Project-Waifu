version: '3.8'

services:
  project-waifu:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: project-waifu
    restart: unless-stopped
    ports:
      - "3020:3000"
    volumes:
      - waifu_data:/app/data
    environment:
      - NODE_ENV=production
      - PORT=3000
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  waifu_data:
